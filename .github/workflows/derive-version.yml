name: Derive version
on:
  workflow_call:
    inputs:
      release-type:
        description: "public or tester"
        type: string
        required: true
    outputs:
      version:
        description: "Version without the v prefix"
        value: ${{ jobs.derive.outputs.version }}
      tag:
        description: "Tag to create, e.g. v2.2.52"
        value: ${{ jobs.derive.outputs.tag }}
      baseline:
        description: "MAJOR.MINOR.0 this version is incremental from"
        value: ${{ jobs.derive.outputs.baseline }}
      baseline-tag:
        description: "Tag of the baseline, e.g. v2.2.0"
        value: ${{ jobs.derive.outputs.baseline-tag }}
      baseline-exists:
        description: "true when the baseline tag has already been released"
        value: ${{ jobs.derive.outputs.baseline-exists }}
      is-prerelease:
        description: "true for tester builds"
        value: ${{ jobs.derive.outputs.is-prerelease }}
      needs-incremental:
        description: "true when this release should also ship an incremental package"
        value: ${{ jobs.derive.outputs.needs-incremental }}

permissions:
  contents: read

jobs:
  derive:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
      baseline: ${{ steps.derive.outputs.baseline }}
      baseline-tag: ${{ steps.derive.outputs.baseline-tag }}
      baseline-exists: ${{ steps.derive.outputs.baseline-exists }}
      is-prerelease: ${{ steps.derive.outputs.is-prerelease }}
      needs-incremental: ${{ steps.derive.outputs.needs-incremental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: |
            VERSION
            scripts
          sparse-checkout-cone-mode: false

      - name: Derive version
        id: derive
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: bash scripts/derive-version.sh "$RELEASE_TYPE"

      - name: Summary
        run: |
          {
            echo "### Version ${{ steps.derive.outputs.version }}"
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.derive.outputs.tag }}\` |"
            echo "| Baseline | \`${{ steps.derive.outputs.baseline-tag }}\` |"
            echo "| Tester build | ${{ steps.derive.outputs.is-prerelease }} |"
            echo "| Incremental package | ${{ steps.derive.outputs.needs-incremental }} |"
          } >> "$GITHUB_STEP_SUMMARY"
